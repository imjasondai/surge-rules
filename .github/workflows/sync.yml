name: 同步上游规则集

on:
  schedule:
    - cron: "0 20 * * *"   # 每天北京时间 04:00
  workflow_dispatch:         # 也可以在 GitHub 网页上手动运行
  push:
    branches: [main]
    paths: ["rules/**", "exclude/**", "extra/**", "sources.json"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 同步上游
        run: python3 scripts/sync.py

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/
          if git diff --cached --quiet; then
            echo "上游无变化"
          else
            git commit -m "同步上游规则集 $(date -u +%F)"
            git push
          fi

      - name: 刷新 jsDelivr 缓存
        run: |
          # 本次同步变化的上游文件 + 本次 push 修改的自维护规则
          files=$(cat changed.txt)
          if [ "${{ github.event_name }}" = "push" ]; then
            files="$files $(git diff --name-only HEAD~1 HEAD -- rules/ upstream/ || true)"
          fi
          for f in $files; do
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f"
            echo "purge $url"
            curl -fsS "$url" > /dev/null || echo "purge 失败（不影响规则，缓存最多 12 小时后自动更新）"
          done
