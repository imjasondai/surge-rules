name: 同步上游规则集

on:
  schedule:
    - cron: "0 20 * * *"   # 每天北京时间 04:00
  workflow_dispatch:         # 也可以在 GitHub 网页上手动运行
  push:
    branches: [main]
    paths: ["rules/**", "exclude/**", "sources.json", ".github/workflows/sync.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史，才能比较整次推送的范围

      - name: 同步上游
        run: python3 scripts/sync.py

      - name: 提交变化
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream/
          if git diff --cached --quiet; then
            echo "上游无变化"
          else
            git commit -m "同步上游规则集 $(date -u +%F)"
            git push
          fi

      - name: 刷新 jsDelivr 缓存
        run: |
          # 本次同步变化的上游文件 + 本次 push 修改的自维护规则
          files=$(cat changed.txt)
          if [ "${{ github.event_name }}" = "push" ]; then
            # 整次推送的范围（before → 推送后的提交），多个提交或合并提交也不会漏
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              files="$files $(git ls-files rules/ upstream/)"   # 新分支：全部刷新
            else
              files="$files $(git diff --name-only "$before" "${{ github.sha }}" -- rules/ upstream/ || true)"
            fi
          fi
          for f in $(printf "%s\n" $files | sort -u); do
            url="https://purge.jsdelivr.net/gh/${{ github.repository }}@main/$f"
            echo "purge $url"
            curl -fsS "$url" > /dev/null || echo "purge 失败（不影响规则，缓存最多 12 小时后自动更新）"
          done
